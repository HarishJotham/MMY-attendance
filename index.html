.brand{min-width:0;flex:1}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(15px,2.4vw,21px);letter-spacing:.14em;margin:0;line-height:1.2;text-wrap:balance}
.brand p{margin:4px 0 0;opacity:.72;font-size:13px;letter-spacing:.02em}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync{font-size:12px;opacity:.8;display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:#9a9;display:inline-block}
.sync.ok i{background:#5fd39b}.sync.local i{background:#f0bd5a}
.ghost{background:transparent;border:1px solid color-mix(in oklab,var(--on-ink) 35%,transparent);color:var(--on-ink);border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.ghost:hover{background:color-mix(in oklab,var(--on-ink) 12%,transparent)}
.ridge{position:absolute;right:-20px;bottom:-2px;width:420px;height:70px;opacity:.10;pointer-events:none}

/* nav + range */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-inline:16px}
.bar-in{max-width:1320px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:8px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1 1 auto;min-width:0}
.tab{background:none;border:0;padding:9px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.tab:hover{color:var(--fg);background:var(--sunk)}
.tab[aria-selected="true"]{color:var(--on-accent);background:var(--accent)}
.range{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.range label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
select,input[type=text],input[type=date],input[type=number],input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
select:hover,input:hover{border-color:color-mix(in oklab,var(--fg) 30%,var(--line))}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:600}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

main{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}

<script>
(() => {
/* ---------- helpers ---------- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const TODAY=iso(new Date());
const fd=s=>{const d=parse(s);return `${d.getDate()} ${MON[d.getMonth()]}'${String(d.getFullYear()).slice(2)}`};
const fdl=s=>{const d=parse(s);return `${WD[d.getDay()]}, ${d.getDate()} ${MONF[d.getMonth()]} ${d.getFullYear()}`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pct=(a,b)=>b?Math.round(a/b*100):0;
const icon=(g,cls='')=>`<svg class="ic ${g==='F'?'f':'m'} ${cls}" aria-label="${g==='F'?'Woman':'Man'}"><use href="#person"/></svg>`;
const ls={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
function sundaysOf(y,m){const out=[];const d=new Date(y,m,1);d.setDate(1+((7-d.getDay())%7));while(d.getMonth()===m){out.push(iso(d));d.setDate(d.getDate()+7)}return out}
function nextSundays(n){const out=[];const d=parse(TODAY);d.setDate(d.getDate()+((7-d.getDay())%7));for(let i=0;i<n;i++){out.push(iso(d));d.setDate(d.getDate()+7)}return out}
function lastSunday(){const d=parse(TODAY);d.setDate(d.getDate()-d.getDay());return iso(d)}

/* ---------- palettes ---------- */
const PALS={
  summit:{name:'Summit',ink:'#3a3637',l:'#3a3637',d:'#d9d3cf'},
  alpine:{name:'Alpine',ink:'#1d3350',l:'#295a8f',d:'#94bcea'},
  pine:{name:'Pine',ink:'#21372e',l:'#2e6a4e',d:'#8fd0ae'},
  ember:{name:'Ember',ink:'#3b2924',l:'#b0502c',d:'#f0a27e'},
  royal:{name:'Royal',ink:'#2a2446',l:'#5a49a6',d:'#b6a9f2'},
  dusk:{name:'Dusk',ink:'#3a2832',l:'#963c65',d:'#eda3c4'}
};
function hexMix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>pad(Math.round(v+(B[i]-v)*t).toString(16))).join('')}
function applyPalette(){
  const c=S.config; let p=PALS[c.palette]||PALS.summit;
  if(c.palette==='custom'&&/^#[0-9a-f]{6}$/i.test(c.custom||'')) p={ink:hexMix(c.custom,'#000000',.55),l:c.custom,d:hexMix(c.custom,'#ffffff',.5)};
  const r=document.documentElement.style; r.setProperty('--p-ink',p.ink); r.setProperty('--p-acc-l',p.l); r.setProperty('--p-acc-d',p.d);
}
function applyMode(){const m=ls.get('mmy-mode')||'system';if(m==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',m)}

/* ---------- state ---------- */
const DEFAULT_TEAMS=['A1','A2','A3','A4','A5','A6'].map((n,i)=>({id:'t'+(i+1),name:n}));
const S={config:{teams:DEFAULT_TEAMS,palette:'summit',custom:'#2f6fd6'},members:{},attendance:{},notices:{},activities:{}};
const thisYear=new Date().getFullYear();
const UI={tab:(['overview','sundays','members','teams'].includes(location.hash.slice(1))?location.hash.slice(1):'overview'),
  year:thisYear,from:0,to:new Date().getMonth(),preset:'ytd',
  sel:lastSunday(),q:'',teamF:'all',
  mq:'',mg:'all',mt:'all',showFormer:false,newG:'M',
  actTeam:'t1',actSel:{},armed:null};
let mode='loading',db=null,loaded=false;
let PS={};
function presentSet(d){return PS[d]||(PS[d]=new Set(S.attendance[d]?.present||[]))}
const teamName=id=>(S.config.teams.find(t=>t.id===id)||{}).name||'—';
const allMembers=()=>Object.entries(S.members).map(([id,m])=>({id,...m})).sort((a,b)=>a.name.localeCompare(b.name));
const activeOn=(m,d)=>(m.joinedOn||'0000')<=d&&(!m.leftOn||m.leftOn>d);
const current=()=>allMembers().filter(m=>!m.leftOn);
const roster=d=>allMembers().filter(m=>activeOn(m,d));
const noticesOn=d=>Object.entries(S.notices).map(([id,n])=>({id,...n})).filter(n=>n.date===d);
function dayStats(d){
  const r=roster(d),p=presentSet(d),inf=new Map(noticesOn(d).map(n=>[n.memberId,n]));
  const pres=r.filter(m=>p.has(m.id)),abs=r.filter(m=>!p.has(m.id));
  const g=(a,x)=>a.filter(m=>m.gender===x).length;
  return {r,pres,abs,inf,informed:abs.filter(m=>inf.has(m.id)),pct:pct(pres.length,r.length),
    mP:g(pres,'M'),mT:g(r,'M'),fP:g(pres,'F'),fT:g(r,'F')};
}
function rangeSundays(){let a=[];for(let m=UI.from;m<=UI.to;m++)a=a.concat(sundaysOf(UI.year,m));return a}
const counted=()=>rangeSundays().filter(d=>d<=TODAY);
function memberRange(m,sun){const el=sun.filter(d=>activeOn(m,d));const at=el.filter(d=>presentSet(d).has(m.id)).length;return {el:el.length,at,p:el.length?at/el.length*100:null}}
const inRange=d=>{const x=parse(d);return x.getFullYear()===UI.year&&x.getMonth()>=UI.from&&x.getMonth()<=UI.to};
const acts=()=>Object.entries(S.activities).map(([id,a])=>({id,...a})).sort((a,b)=>b.date.localeCompare(a.date));
const rangeLabel=()=>UI.from===UI.to?`${MONF[UI.from]} ${UI.year}`:`${MON[UI.from]}–${MON[UI.to]} ${UI.year}`;

/* ---------- persistence ---------- */
const Q={};
function persist(path,body){
  if(mode==='local'){saveLocal();return}
  if(mode!=='db')return;
  Q[path]=(Q[path]||Promise.resolve()).then(()=>body===null?db.doc(path).delete():db.doc(path).set(body)).catch(e=>{
    if(e&&e.code==='unavailable'){return new Promise(r=>setTimeout(r,600+Math.random()*600)).then(()=>body===null?db.doc(path).delete():db.doc(path).set(body)).catch(()=>toast("Couldn't save. Check your connection and try again.",true))}
    toast(e&&e.code==='invalid_argument'?"You can view this tracker but not change it.":e&&e.code==='quota_exceeded'?"Storage is full. Delete old activities to make room.":"Couldn't save. Check your connection and try again.",true)});
}

function funnel(sun){
  const pool=allMembers().filter(m=>sun.some(d=>activeOn(m,d)));
  const rs=pool.map(m=>memberRange(m,sun));
  const stages=[['Members in range',pool.length],['Came at least once',rs.filter(r=>r.at>0).length],['Came to half or more',rs.filter(r=>r.p>=50).length],['Came to 75% or more',rs.filter(r=>r.p>=75).length],['Never missed',rs.filter(r=>r.el&&r.at===r.el).length]];
  if(!pool.length||!sun.length)return '<p class="empty">No counted Sundays in this range yet.</p>';
  const max=stages[0][1]||1;
  return `<div class="funnel">${stages.map(([l,v],i)=>{
    const w=Math.max(6,v/max*100),nw=Math.max(6,(stages[i+1]?stages[i+1][1]:v)/max*100);
    const a=(100-w)/2,b=(100-nw)/2;
    return `<div class="fn-row"><div class="fn-lab"><b>${l}</b><span>${v} · ${pct(v,max)}%</span></div><div class="fn-slab" style="clip-path:polygon(${a}% 0,${100-a}% 0,${100-b}% 100%,${b}% 100%);opacity:${1-i*0.13}"></div></div>`}).join('')}</div>`;
}
function teamStats(){

}
function hiLo(ts){const has=ts.some(t=>t.pts>0);if(!has)return {};const s=[...ts].sort((a,b)=>b.pts-a.pts);return {hi:s[0].id,lo:s[s.length-1].pts<s[0].pts?s[s.length-1].id:null}}

function drawBars(el){
  const sun=counted();const rows=sun.map(d=>({d,...dayStats(d)}));
  if(!rows.length){el.innerHTML='<p class="empty">No counted Sundays in this range yet.</p>';return}
  const W=Math.max(300,el.clientWidth),H=250,m={l:38,r:10,t:26,b:30},iw=W-m.l-m.r,ih=H-m.t-m.b,n=rows.length;
  const bw=iw/n,gap=Math.min(8,bw*.3),barW=Math.max(2,bw-gap),y=v=>m.t+ih-(v/100)*ih;

  rows.forEach((r,i)=>{const x=m.l+i*bw+gap/2,yy=y(Math.max(r.pct,1)),h=m.t+ih-yy,rad=Math.min(4,h,barW/2);
    s+=`<path class="bar" data-i="${i}" d="M${x},${yy+h} V${yy+rad} Q${x},${yy} ${x+rad},${yy} H${x+barW-rad} Q${x+barW},${yy} ${x+barW},${yy+rad} V${yy+h} Z"/>`;
    if(i%every===0)s+=`<text x="${x+barW/2}" y="${H-10}" text-anchor="middle">${fd(r.d).replace(/'\d\d$/,'')}</text>`;});
  s+=`<line class="avg" x1="${m.l}" x2="${W-m.r}" y1="${y(avg)}" y2="${y(avg)}"/><line class="avg" x1="${W-m.r-92}" x2="${W-m.r-72}" y1="10" y2="10"/><text x="${W-m.r}" y="14" text-anchor="end" style="fill:var(--fg)">average ${Math.round(avg)}%</text>`;
  rows.forEach((r,i)=>s+=`<rect class="hit" data-i="${i}" x="${m.l+i*bw}" y="${m.t}" width="${bw}" height="${ih}"/>`);
  el.innerHTML=s+'</svg>';
  const svg=el.querySelector('svg');let hot=null;
  svg.addEventListener('mousemove',e=>{const t=e.target.closest('.hit');if(!t){hideTip();return}const i=+t.dataset.i,r=rows[i];
    if(hot!==i){svg.querySelectorAll('.bar.hot').forEach(b=>b.classList.remove('hot'));svg.querySelector(`.bar[data-i="${i}"]`)?.classList.add('hot');hot=i}
    showTip(`<b>${fdl(r.d)}</b><br>${r.pct}% · ${r.pres.length} of ${r.r.length} present<br>Men ${r.mP}/${r.mT} · Women ${r.fP}/${r.fT}${r.informed.length?`<br>${r.informed.length} informed absent`:''}`,e.clientX,e.clientY)});
  svg.addEventListener('mouseleave',()=>{hideTip();svg.querySelectorAll('.bar.hot').forEach(b=>b.classList.remove('hot'));hot=null});
  svg.addEventListener('click',e=>{const t=e.target.closest('.hit');if(!t)return;hideTip();UI.sel=rows[+t.dataset.i].d;go('sundays')});

let raf=0;

function render(){
  PS={};applyPalette();
  const sync=document.getElementById('sync');
  sync.className='sync '+(mode==='db'?'ok':mode==='local'?'local':'');
  sync.lastElementChild.textContent=mode==='db'?'Saved & synced':mode==='local'?'Saved on this device':'Connecting…';
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===UI.tab));
  renderRange();
  if(!document.getElementById('pop').hidden)renderPop();
  const main=document.getElementById('main');
  if(!loaded){main.innerHTML='<div class="loading">Loading attendance…</div>';return}
  const a=document.activeElement,fid=a&&a.id;let s1=null,s2=null;try{s1=a.selectionStart;s2=a.selectionEnd}catch{}
  const dayScroll=document.getElementById('dayPanel')?.scrollTop||0;
  let banner=mode==='local'?`<div class="banner">Sample data shown. Changes are saved in this browser only${window.claude?'; sign in to claude.ai to keep one shared record':''}.</div>`:'';
  if(mode==='db'&&!Object.keys(S.members).length)banner=`<div class="banner">No members yet. Add your first member on the Members tab, or <button class="btn sm" data-act="loadSample">load 25 sample members</button>.</div>`;
  main.innerHTML=banner+({overview:vOverview,sundays:vSundays,members:vMembers,teams:vTeams}[UI.tab])();
  main.querySelectorAll('[data-chart="bars"]').forEach(drawBars);
  const dp=document.getElementById('dayPanel');if(dp)dp.scrollTop=dayScroll;
  if(fid){const el=document.getElementById(fid);if(el&&document.activeElement!==el){el.focus({preventScroll:true});try{if(s1!==null)el.setSelectionRange(s1,s2)}catch{}}}
}
function go(tab,anchor){UI.tab=tab;try{history.replaceState(null,'','#'+tab)}catch{}render();if(anchor)document.getElementById(anchor)?.scrollIntoView({behavior:'smooth'});else window.scrollTo({top:0})}

/* ---------- events ---------- */
let armT;
function arm(k){UI.armed=k;clearTimeout(armT);armT=setTimeout(()=>{UI.armed=null;render()},3500)}
document.addEventListener('click',e=>{
  const pop=document.getElementById('pop');
  if(!pop.hidden&&!e.target.closest('#pop,#themeBtn')){pop.hidden=true;document.getElementById('themeBtn').setAttribute('aria-expanded','false')}
  const t=e.target.closest('[data-tab]:not([data-act]),[data-act]');if(!t)return;
  if(t.classList.contains('tab')){go(t.dataset.tab);return}
  const act=t.dataset.act,id=t.dataset.id;
  switch(act){
    case 'theme':pop.hidden=!pop.hidden;t.setAttribute('aria-expanded',!pop.hidden);if(!pop.hidden)renderPop();break;
    case 'pal':if(t.dataset.k==='custom')S.config.custom=document.getElementById('cc').value;S.config.palette=t.dataset.k;saveConfig();render();break;
    case 'mode':ls.set('mmy-mode',t.dataset.m);applyMode();renderPop();break;
    case 'preset':setPreset(t.dataset.k);render();break;
    case 'go':go(t.dataset.tab,t.dataset.anchor);break;
    case 'day':UI.sel=t.dataset.d;UI.q='';UI.nMember='';render();if(innerWidth<=980)document.getElementById('dayPanel')?.scrollIntoView({behavior:'smooth'});break;
    case 'step':stepSunday(+t.dataset.dir);const y=parse(UI.sel);if(y.getFullYear()===UI.year&&(y.getMonth()<UI.from||y.getMonth()>UI.to)){UI.from=Math.min(UI.from,y.getMonth());UI.to=Math.max(UI.to,y.getMonth());UI.preset=null}render();break;
    case 'mark':{const set=new Set(presentSet(UI.sel));const m=S.members[id];if(t.dataset.v==='1'){set.add(id);toast(`${m.name} marked present`)}else set.delete(id);setAttendance(UI.sel,[...set]);if(t.closest('.results')){UI.q=''}render();document.getElementById('dq')?.focus();break}
    case 'allPresent':setAttendance(UI.sel,roster(UI.sel).map(m=>m.id));toast('Everyone marked present');render();break;
    case 'reset':if(UI.armed!=='reset'){arm('reset');render();break}UI.armed=null;setAttendance(UI.sel,[]);toast('Everyone marked absent');render();break;
    case 'teamF':UI.teamF=t.dataset.t;render();break;
    case 'addNoticeDay':if(!UI.nMember){toast('Choose who will be absent first.',true);break}setNotice(uid('n'),{memberId:UI.nMember,date:UI.sel,reason:(UI.nReason||'').trim(),createdAt:new Date().toISOString()});toast('Absence notice saved');UI.nMember='';UI.nReason='';render();break;
    case 'addNotice2':{const d=UI.n2Date||nextSundays(1)[0];if(!UI.n2Member){toast('Choose who will be absent first.',true);break}if(noticesOn(d).some(n=>n.memberId===UI.n2Member)){toast('That notice is already logged.',true);break}setNotice(uid('n'),{memberId:UI.n2Member,date:d,reason:(UI.n2Reason||'').trim(),createdAt:new Date().toISOString()});toast(`Notice saved for ${fd(d)}`);UI.n2Member='';UI.n2Reason='';render();break}
    case 'delNotice':setNotice(id,null);toast('Notice removed');render();break;
    case 'newG':UI.newG=t.dataset.g;render();break;
    case 'addMember':{const n=(UI.newName||'').trim();if(!n){toast('Type the member’s name first.',true);document.getElementById('an')?.focus();break}
      if(current().some(m=>m.name.toLowerCase()===n.toLowerCase())){toast(`${n} is already a member.`,true);break}
      setMember(uid('m'),{name:n,gender:UI.newG,team:UI.newTeam||S.config.teams[0].id,joinedOn:UI.newJoin||TODAY,leftOn:null});UI.newName='';toast(`${n} added`);render();document.getElementById('an')?.focus();break}
    case 'mg':UI.mg=t.dataset.g;render();break;
    case 'former':UI.showFormer=!UI.showFormer;render();break;
    case 'edit':UI.editing=id;UI.editName=S.members[id].name;render();document.getElementById('ed-'+id)?.focus();break;
    case 'cancelEdit':UI.editing=null;render();break;
    case 'saveEdit':{const n=(UI.editName||'').trim();if(!n){toast('Name can’t be empty.',true);break}setMember(id,{...S.members[id],name:n});UI.editing=null;toast('Name updated');render();break}
    case 'remove':if(UI.armed!=='rm'+id){arm('rm'+id);render();break}UI.armed=null;setMember(id,{...S.members[id],leftOn:TODAY});toast(`${S.members[id].name} removed. Find them under Former members.`);render();break;
    case 'restore':setMember(id,{...S.members[id],leftOn:null});toast(`${S.members[id].name} restored`);render();break;
    case 'selAll':current().filter(m=>m.team===UI.actTeam).forEach(m=>UI.actSel[m.id]=t.dataset.v==='1');render();break;
    case 'addAct':{const ti=(UI.actTitle||'').trim();const ids=current().filter(m=>m.team===UI.actTeam&&UI.actSel[m.id]).map(m=>m.id);const p=Number(UI.actPts??10);
      if(!ti){toast('Give the activity a name.',true);break}if(!ids.length){toast('Tick at least one participant.',true);break}if(!(p>=0)){toast('Points must be 0 or more.',true);break}
      setActivity(uid('a'),{title:ti,date:UI.actDate||TODAY,team:UI.actTeam,memberIds:ids,points:p,createdAt:new Date().toISOString()});UI.actTitle='';UI.actSel={};toast(`Activity added: ${ids.length} × ${p} pts`);render();break}
    case 'delAct':if(UI.armed!=='ac'+id){arm('ac'+id);render();break}UI.armed=null;setActivity(id,null);toast('Activity deleted');render();break;
    case 'loadSample':loadSample();break;
  }
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.f){const k=t.dataset.f;UI[k]=t.value;

});

/* ---------- boot ---------- */
applyMode();applyPalette();render();
function startLocal(){
  if(mode==='db')return;mode='local';
  let saved=null;try{saved=JSON.parse(ls.get('mmy-state-v1')||'null')}catch{}
  if(saved&&saved.members){Object.assign(S,saved)}else{const s=sample();Object.assign(S,s);saveLocal()}
  loaded=true;render();
}
async function boot(){
  if(!window.claude||!window.claude.use){startLocal();return}
  let d=null;try{d=await window.claude.use('db')}catch{}
  if(!d){startLocal();return}
  db=d;mode='db';
  const got={};const need=['config','members','attendance','notices','activities'];
  const ready=()=>{if(!loaded&&need.every(k=>got[k])){loaded=true}scheduleRender()};
  const onErr=e=>{if(e&&e.code==='revoked'){toast('This tracker is read-only now.',true)}else toast('Live updates stopped. Reload the page to reconnect.',true)};
  db.doc('config/main').onSnapshot(s=>{if(s.exists){const c=JSON.parse(JSON.stringify(s.data()));S.config={...S.config,...c};if(!Array.isArray(S.config.teams)||S.config.teams.length!==6)S.config.teams=DEFAULT_TEAMS}got.config=1;ready()},onErr);
  for(const k of ['members','attendance','notices','activities']){
    db.collection(k).onSnapshot(snap=>{const o={};snap.docs.forEach(x=>o[x.id]=JSON.parse(JSON.stringify(x.data())));S[k]=o;got[k]=1;ready()},onErr);
  }
}
boot();
})();
</script>
